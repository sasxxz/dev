<!DOCTYPE html>
<html>

<head>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* 禁用滚动 */
            height: 100vh;
            /* 满屏高度 */
            width: 100vw;
            /* 满屏宽度 */
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }

        .content {
            text-align: center;
            padding: 20px;
        }
    </style>
    <title>3month7</title>
    <link rel="icon" href="/static/photo/37Favicon.jpg" type="image/x-icon">
    <style>
        .butt {
            display: flex;
            justify-content: center;
            /* align-items: center; */
            padding-top: 7%;
        }

        .dbg {
            width: 100%;
            height: 100%;
            background-image: url(/static/photo/bg1.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            position: absolute;
        }

        .bg37 {
            display: inline-block;
            width: 400px;
            height: 510px;
            border: 2px solid rgb(97, 97, 210);
            background-image: url(/static/photo/37bg.jpg);
            /* background-size: 100%; */
            background-size: cover;
            background-position: top;
            background-repeat: no-repeat;
            position: relative;
        }

        .yl {
            width: 200px;
            height: 200px;
            margin-left: 5px;
            background-image: url(/static/photo/yunli.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: absolute
        }

        .but-image {
            display: inline-block;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            padding-bottom: 20px;
            padding-left: 30px;
        }


        .but-image img {
            width: 130px;
            height: auto;
            transition: transform 0.3s;
            opacity: 0;
            /* transition: opacity 0.3s ease; */
        }

        .but-image:hover img {
            opacity: 1;
            transform: translateY(0);
            transform: scale(1.2);
            /* 悬停时轻微放大 */
        }
    </style>
</head>

<body>
    <div class="dbg">
        <div class="yl"></div>
        <div class="butt">
            <button class="bg37" onclick="shutdownBackend()">
                <div class="but-image">
                    <img src="/static/photo/button1.jpeg">
                </div>
            </button>
            <!-- <p id="result"></p> -->
        </div>


    </div>
    <div id="result"
        style="display: none; position: fixed; top: 20px; right: 20px; background: #ffebee; padding: 10px; border-radius: 4px; border: 1px solid #ef9a9a;">
    </div>
    <script>
        function shutdownBackend() {
            // 发送请求到后端的关闭接口
            fetch('/shutdown', {
                method: 'POST'
            })
                .then(response => response.text())
                .then(text => {
                    const okElement = document.getElementById('result');
                    okElement.textContent = '愿我们在清醒的世界再会...';
                    okElement.style.display = 'block'; // 显示正确元素
                    // document.getElementById('result').textContent = text;
                })
                .catch(error => {
                    const errorElement = document.getElementById('result');
                    errorElement.textContent = '请求失败: ' + error.message;
                    errorElement.style.display = 'block'; // 显示错误元素
                });
        }
    </script>
</body>

</html>
